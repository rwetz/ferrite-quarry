[package]
name = "ferrite-quarry"
version = "0.1.3"
description = "Fast local file and content search with a trigram index and native previews."
authors = ["Ryan Wetzstein"]
license = "Apache-2.0"
repository = "https://github.com/rwetz/ferrite-quarry"
default-run = "ferrite-quarry"
edition = "2024"
rust-version = "1.88"

[dependencies]
ferrite-design = { git = "https://github.com/rwetz/ferrite-design", rev = "b37c50104b6e8fcb88e5fdd787a5b7112f17466d" }
# Must match ferrite-design exactly (PITFALLS §1).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

# gpui is sluggish unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
